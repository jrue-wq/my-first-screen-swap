<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team Members — Horizon UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<style>
/* ─── Horizon UI Design System Tokens ─── */
:root {
  /* Brand */
  --brand-100: #E9E3FF;
  --brand-500: #422AFB;
  --brand-600: #3311DB;
  --brand-900: #11047A;

  /* Secondary gray */
  --secondary-gray-100: #E0E5F2;
  --secondary-gray-300: #F4F7FE;
  --secondary-gray-400: #E9EDF7;
  --secondary-gray-500: #8F9BBA;
  --secondary-gray-600: #A3AED0;
  --secondary-gray-700: #707EAE;
  --secondary-gray-900: #1B2559;

  /* Navy */
  --navy-700: #1B254B;

  /* Status */
  --green-100: #E6FAF5;
  --green-500: #01B574;
  --red-100:   #FEEFEE;
  --red-500:   #EE5D50;
  --orange-100:#FFF6DA;
  --orange-500:#FFB547;
  --blue-500:  #3965FF;
  --gray-100:  #FAFCFE;
  --gray-400:  #A3AED0;

  /* Semantic aliases */
  --color-primary:       var(--brand-500);
  --color-primary-hover: var(--brand-600);
  --color-primary-tint:  #F2EFFF;

  --text-heading:   var(--secondary-gray-900);
  --text-body:      var(--navy-700);
  --text-muted:     var(--secondary-gray-600);
  --text-label:     var(--gray-400);

  --surface-page:   var(--secondary-gray-300);
  --surface-card:   #fff;

  --border-subtle:  var(--secondary-gray-100);

  --status-success:    var(--green-500);
  --status-error:      var(--red-500);
  --status-warning:    var(--orange-500);
  --status-success-bg: var(--green-100);
  --status-error-bg:   var(--red-100);
  --status-warning-bg: var(--orange-100);

  /* Typography */
  --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --tracking-tight:  -0.5px;
  --tracking-normal: -0.2px;

  /* Radii */
  --radius-lg:  16px;
  --radius-xl:  20px;
  --radius-pill: 50px;

  /* Shadows */
  --shadow-card:   14px 17px 40px 4px rgba(112, 144, 176, 0.08);
  --shadow-button: 45px 76px 113px 7px rgba(112, 144, 176, 0.08);
}

/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: var(--font-sans);
  letter-spacing: var(--tracking-tight);
  -webkit-font-smoothing: antialiased;
}

body {
  background: var(--surface-page);
  color: var(--text-body);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 32px;
}

/* ─── Layout ─── */
.wrap { width: 100%; max-width: 1140px; }

.page-head { margin-bottom: 24px; }
.crumb {
  font-size: 13px;
  color: var(--secondary-gray-700);
  font-weight: 500;
  margin-bottom: 4px;
}
.page-title {
  font-size: 34px;
  font-weight: 700;
  color: var(--text-heading);
  letter-spacing: -1px;
  line-height: 1;
}

.card {
  background: var(--surface-card);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

/* ─── Toolbar ─── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 25px;
  flex-wrap: wrap;
}
.toolbar .title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-heading);
  margin-right: auto;
}

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--secondary-gray-300);
  border-radius: 30px;
  padding: 10px 16px;
  width: 240px;
  transition: box-shadow 0.2s ease;
}
.search:focus-within {
  box-shadow: 0 0 0 2px var(--brand-500);
}
.search .material-icons { font-size: 18px; color: var(--secondary-gray-600); }
.search input {
  border: none;
  background: transparent;
  outline: none;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-heading);
  width: 100%;
  letter-spacing: var(--tracking-normal);
}
.search input::placeholder { color: var(--secondary-gray-600); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: var(--tracking-normal);
  border: none;
  border-radius: var(--radius-lg);
  padding: 0 20px;
  height: 44px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.1s ease;
  white-space: nowrap;
}
.btn .material-icons { font-size: 18px; }
.btn:active { transform: scale(0.97); }

.btn.brand {
  background: var(--brand-500);
  color: #fff;
  box-shadow: var(--shadow-button);
}
.btn.brand:hover { background: var(--brand-600); }

.btn.light {
  background: var(--secondary-gray-300);
  color: var(--secondary-gray-900);
}
.btn.light:hover { background: var(--secondary-gray-400); }

/* ─── Filter Tabs ─── */
.tabs {
  display: flex;
  gap: 8px;
  padding: 0 25px 18px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}

.tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: var(--tracking-normal);
  border: none;
  cursor: pointer;
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--secondary-gray-700);
  transition: color 0.2s ease, background 0.2s ease;
}
.tab:hover { color: var(--brand-500); }
.tab.active {
  background: var(--color-primary-tint);
  color: var(--brand-500);
}
.tab .count {
  font-size: 12px;
  font-weight: 700;
  background: var(--secondary-gray-300);
  color: var(--secondary-gray-700);
  border-radius: 8px;
  padding: 2px 7px;
  transition: background 0.2s ease, color 0.2s ease;
}
.tab.active .count {
  background: #fff;
  color: var(--brand-500);
}

/* ─── Bulk Action Bar ─── */
.bulkbar {
  display: none;
  align-items: center;
  gap: 16px;
  padding: 14px 25px;
  background: var(--color-primary-tint);
  border-bottom: 1px solid var(--border-subtle);
  animation: slideDown 0.2s ease;
}
.bulkbar.show { display: flex; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bulkbar .sel-count {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-500);
  margin-right: auto;
}

.bulk-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: var(--tracking-normal);
  color: var(--secondary-gray-900);
  background: #fff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.bulk-btn:hover { background: var(--secondary-gray-300); }
.bulk-btn .material-icons { font-size: 17px; }
.bulk-btn.danger { color: var(--status-error); }

/* ─── Table ─── */
table { width: 100%; border-collapse: collapse; }

th {
  text-align: left;
  font-size: 12px;
  color: var(--text-label);
  font-weight: 700;
  padding: 16px 25px;
  border-bottom: 1px solid var(--border-subtle);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
  user-select: none;
}
th.sortable { cursor: pointer; transition: color 0.2s ease; }
th.sortable:hover { color: var(--secondary-gray-700); }

.th-inner { display: inline-flex; align-items: center; gap: 4px; }

.sort-arrow {
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  color: var(--brand-500);
}
th.sorted .sort-arrow { opacity: 1; }
th.desc .sort-arrow { transform: rotate(180deg); }

td {
  padding: 14px 25px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  border-bottom: 1px solid var(--border-subtle);
}
tbody tr { transition: background 0.15s ease; }
tbody tr:hover { background: var(--gray-100); }
tbody tr.selected { background: var(--color-primary-tint); }
tbody tr:last-child td { border-bottom: none; }

.col-check { width: 52px; }

/* ─── Custom Checkbox ─── */
.chk {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--secondary-gray-100);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease;
  background: transparent;
  flex-shrink: 0;
}
.chk:hover { border-color: var(--brand-500); }
.chk.on { background: var(--brand-500); border-color: transparent; }
.chk.indet { background: var(--brand-500); border-color: transparent; }
.chk .check-icon { opacity: 0; transition: opacity 0.15s ease; }
.chk.on .check-icon { opacity: 1; }
.chk .indet-bar { display: none; }
.chk.indet .indet-bar { display: block; }
.chk.indet .check-icon { display: none; }

/* ─── User Cell ─── */
.user-cell { display: flex; align-items: center; gap: 12px; }

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
}

.user-name { font-size: 14px; font-weight: 700; color: var(--text-heading); }
.user-email {
  font-size: 13px;
  font-weight: 500;
  color: var(--secondary-gray-600);
  margin-top: 1px;
}

/* ─── Status Badge ─── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: var(--tracking-normal);
  padding: 7px 12px;
  border-radius: 10px;
  white-space: nowrap;
}
.badge .material-icons { font-size: 15px; }
.badge.success { background: var(--status-success-bg); color: var(--status-success); }
.badge.error   { background: var(--status-error-bg);   color: var(--status-error); }
.badge.warning { background: var(--status-warning-bg); color: #E2A23B; }
.badge.gray    { background: var(--secondary-gray-300); color: var(--secondary-gray-700); }

/* ─── Role & Date ─── */
.role { font-size: 14px; font-weight: 500; color: var(--secondary-gray-700); }
.date { font-size: 14px; font-weight: 500; color: var(--secondary-gray-700); white-space: nowrap; }

/* ─── Progress Bar ─── */
.prog { display: flex; align-items: center; gap: 12px; min-width: 150px; }
.prog .pct { font-size: 14px; font-weight: 700; color: var(--text-heading); width: 38px; }
.prog .track {
  flex: 1;
  height: 8px;
  border-radius: 50px;
  background: var(--secondary-gray-100);
  overflow: hidden;
}
.prog .fill {
  height: 100%;
  border-radius: 50px;
  background: var(--brand-500);
  transition: width 0.4s ease;
}

/* ─── Row Action Button ─── */
.row-action {
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--secondary-gray-600);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.row-action:hover {
  background: var(--secondary-gray-300);
  color: var(--brand-500);
}
.row-action .material-icons { font-size: 20px; }

/* ─── Empty State ─── */
.empty-state {
  padding: 60px 25px;
  text-align: center;
  color: var(--secondary-gray-600);
  font-weight: 500;
}
.empty-state .material-icons {
  font-size: 48px;
  display: block;
  margin: 0 auto 12px;
  color: var(--secondary-gray-500);
}
.empty-state p { font-size: 14px; }

/* ─── Footer / Pagination ─── */
.footer {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 25px;
  flex-wrap: wrap;
  border-top: 1px solid var(--border-subtle);
}
.footer .info {
  font-size: 14px;
  font-weight: 500;
  color: var(--secondary-gray-600);
  margin-right: auto;
}
.footer .info b { color: var(--text-heading); font-weight: 700; }

.per-page {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--secondary-gray-600);
}
.per-page select {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 6px 10px;
  background: #fff;
  cursor: pointer;
  letter-spacing: var(--tracking-normal);
  outline: none;
  transition: border-color 0.2s ease;
}
.per-page select:focus { border-color: var(--brand-500); }

.pager { display: flex; align-items: center; gap: 6px; }

.pg {
  min-width: 36px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: var(--secondary-gray-300);
  color: var(--secondary-gray-900);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
}
.pg:hover:not(:disabled) { background: var(--secondary-gray-400); }
.pg.active { background: var(--brand-500); color: #fff; }
.pg:disabled { opacity: 0.4; cursor: not-allowed; }
.pg .material-icons { font-size: 18px; }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  body { padding: 24px 16px; }
  .toolbar { gap: 12px; }
  .search { width: 100%; order: 3; }
  .toolbar .title { font-size: 18px; }
  th, td { padding: 12px 16px; }
  .footer { padding: 14px 16px; }
  .tabs { padding: 0 16px 14px; }
  .col-progress { display: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <!-- Page header -->
  <div class="page-head">
    <div class="crumb">Pages / Data Tables</div>
    <div class="page-title">Team Members</div>
  </div>

  <div class="card">
    <!-- Toolbar -->
    <div class="toolbar">
      <span class="title">All Members</span>
      <div class="search">
        <span class="material-icons">search</span>
        <input id="searchInput" type="text" placeholder="Search name, email, role…" aria-label="Search members" autocomplete="off" />
      </div>
      <button class="btn light" id="resetBtn">
        <span class="material-icons">swap_vert</span>Reset
      </button>
      <button class="btn brand" id="addBtn">
        <span class="material-icons">add</span>Add Member
      </button>
    </div>

    <!-- Filter tabs -->
    <div class="tabs" id="tabs" role="tablist" aria-label="Filter by status"></div>

    <!-- Bulk action bar -->
    <div class="bulkbar" id="bulkbar" role="toolbar" aria-label="Bulk actions">
      <span class="sel-count" id="selCount"></span>
      <button class="bulk-btn">
        <span class="material-icons">mail_outline</span>Email
      </button>
      <button class="bulk-btn">
        <span class="material-icons">archive</span>Archive
      </button>
      <button class="bulk-btn danger">
        <span class="material-icons">delete_outline</span>Delete
      </button>
    </div>

    <!-- Table -->
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th class="col-check">
              <span class="chk" id="selectAllChk" role="checkbox" aria-label="Select all rows" tabindex="0">
                <svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M2.5 6.5L5 9L9.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg class="indet-bar" width="10" height="2" viewBox="0 0 10 2">
                  <rect width="10" height="2" rx="1" fill="#fff"/>
                </svg>
              </span>
            </th>
            <th class="sortable" data-key="name">
              <span class="th-inner">Name<span class="material-icons sort-arrow">arrow_upward</span></span>
            </th>
            <th class="sortable" data-key="status">
              <span class="th-inner">Status<span class="material-icons sort-arrow">arrow_upward</span></span>
            </th>
            <th class="sortable" data-key="role">
              <span class="th-inner">Role<span class="material-icons sort-arrow">arrow_upward</span></span>
            </th>
            <th class="sortable" data-key="date">
              <span class="th-inner">Joined<span class="material-icons sort-arrow">arrow_upward</span></span>
            </th>
            <th class="sortable col-progress" data-key="progress">
              <span class="th-inner">Onboarding<span class="material-icons sort-arrow">arrow_upward</span></span>
            </th>
            <th aria-label="Actions"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- Footer / Pagination -->
    <div class="footer">
      <span class="info" id="footerInfo"></span>
      <div class="per-page">
        Rows per page
        <select id="perPageSelect" aria-label="Rows per page">
          <option value="5">5</option>
          <option value="8" selected>8</option>
          <option value="12">12</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="pager" id="pager" role="navigation" aria-label="Pagination"></div>
    </div>
  </div>
</div>

<script>

  /* ─── State ─── */

  };

  /* ─── Helpers ─── */
  function initials(name) {
    var parts = name.trim().split(' ');

  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ─── Filter + Sort ─── */
  function getFilteredRows() {
    var q = state.search.trim().toLowerCase();
    var rows = ROWS.filter(function (row) {
      if (state.filter !== 'All' && row.status !== state.filter) return false;
      if (!q) return true;
      return (row.name + ' ' + row.email + ' ' + row.role).toLowerCase().indexOf(q) !== -1;
    });

    if (state.sortKey) {
      rows.sort(function (a, b) {
        var x = a[state.sortKey];
        var y = b[state.sortKey];
        if (state.sortKey === 'date') {
          x = new Date(x).getTime();
          y = new Date(y).getTime();
        } else if (typeof x === 'string') {
          x = x.toLowerCase();
          y = y.toLowerCase();
        }
        if (x < y) return -state.sortDir;
        if (x > y) return  state.sortDir;
        return 0;
      });
    }
    return rows;
  }

  /* ─── Render: Tabs ─── */
  function renderTabs() {
    var counts = { All: ROWS.length };
    Object.keys(STATUS_MAP).forEach(function (s) {
      counts[s] = ROWS.filter(function (r) { return r.status === s; }).length;
    });

    var order = ['All', 'Approved', 'Pending', 'Error', 'Disabled'];
    var html = order.map(function (key) {
      var active = state.filter === key;
      return '<button class="tab' + (active ? ' active' : '') + '" data-filter="' + key + '"' +
        ' role="tab" aria-selected="' + active + '">' +
        escapeHtml(key) +
        '<span class="count">' + counts[key] + '</span>' +
        '</button>';
    }).join('');

    var el = document.getElementById('tabs');
    el.innerHTML = html;
    el.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.filter = btn.dataset.filter;
        state.page = 1;
        render();
      });
    });
  }

  /* ─── Render: Sort headers ─── */
  function renderSortHeaders() {
    document.querySelectorAll('th.sortable').forEach(function (th) {
      th.classList.toggle('sorted', th.dataset.key === state.sortKey);
      th.classList.toggle('desc', th.dataset.key === state.sortKey && state.sortDir === -1);
      th.setAttribute('aria-sort',
        th.dataset.key !== state.sortKey ? 'none'
        : state.sortDir === 1 ? 'ascending' : 'descending');
    });
  }

  /* ─── Render: Table body ─── */
  function renderBody(pageRows) {
    if (pageRows.length === 0) {
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
        '<span class="material-icons">search_off</span>' +
        '<p>No members match your filters</p>' +
        '</div></td></tr>';
      return;
    }

    var html = pageRows.map(function (row) {
      var st  = STATUS_MAP[row.status];
      var sel = state.selected.has(row.id);

      return '<tr class="' + (sel ? 'selected' : '') + '" data-id="' + row.id + '">' +
        // Checkbox
        '<td class="col-check">' +
          '<span class="chk row-chk ' + (sel ? 'on' : '') + '" data-id="' + row.id + '"' +
          ' role="checkbox" aria-checked="' + sel + '" tabindex="0">' +
            '<svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">' +
              '<path d="M2.5 6.5L5 9L9.5 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</span>' +
        '</td>' +
        // Name + email
        '<td>' +
          '<div class="user-cell">' +
            '<div class="avatar" style="background:' + row.avatarBg + '">' + escapeHtml(initials(row.name)) + '</div>' +
            '<div>' +
              '<div class="user-name">' + escapeHtml(row.name) + '</div>' +
              '<div class="user-email">' + escapeHtml(row.email) + '</div>' +
            '</div>' +
          '</div>' +
        '</td>' +
        // Status badge
        '<td>' +
          '<span class="badge ' + st.cls + '">' +
            '<span class="material-icons">' + st.icon + '</span>' +
            escapeHtml(row.status) +
          '</span>' +
        '</td>' +
        // Role
        '<td><span class="role">' + escapeHtml(row.role) + '</span></td>' +
        // Joined date
        '<td><span class="date">' + escapeHtml(formatDate(row.date)) + '</span></td>' +
        // Progress bar
        '<td class="col-progress">' +
          '<div class="prog">' +
            '<span class="pct">' + row.progress + '%</span>' +
            '<div class="track"><div class="fill" style="width:' + row.progress + '%"></div></div>' +
          '</div>' +
        '</td>' +
        // Action button
        '<td style="text-align:right">' +
          '<button class="row-action" aria-label="More options for ' + escapeHtml(row.name) + '">' +
            '<span class="material-icons">more_horiz</span>' +
          '</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    var tbody = document.getElementById('tbody');
    tbody.innerHTML = html;

    // Row checkbox handlers
    tbody.querySelectorAll('.row-chk').forEach(function (chk) {
      var handler = function (e) {
        if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return;
        if (e.type === 'keydown') e.preventDefault();
        e.stopPropagation();
        var id = +chk.dataset.id;
        if (state.selected.has(id)) state.selected.delete(id);
        else state.selected.add(id);
        render();
      };
      chk.addEventListener('click', handler);
      chk.addEventListener('keydown', handler);
    });
  }

  /* ─── Render: Select-all checkbox state ─── */
  function renderSelectAll(pageRows) {
    var allChk  = document.getElementById('selectAllChk');
    var pageIds = pageRows.map(function (r) { return r.id; });
    var selCount = pageIds.filter(function (id) { return state.selected.has(id); }).length;

    allChk.classList.remove('on', 'indet');
    if (pageIds.length > 0 && selCount === pageIds.length) {
      allChk.classList.add('on');
      allChk.setAttribute('aria-checked', 'true');
    } else if (selCount > 0) {
      allChk.classList.add('indet');
      allChk.setAttribute('aria-checked', 'mixed');
    } else {
      allChk.setAttribute('aria-checked', 'false');
    }
  }

  /* ─── Render: Bulk bar ─── */
  function renderBulkBar() {
    var bar = document.getElementById('bulkbar');
    if (state.selected.size > 0) {
      bar.classList.add('show');
      document.getElementById('selCount').textContent = state.selected.size + ' selected';
    } else {
      bar.classList.remove('show');
    }
  }

  /* ─── Render: Footer info ─── */
  function renderFooterInfo(total, start) {
    var from = total === 0 ? 0 : start + 1;
    var to   = Math.min(start + state.perPage, total);
    document.getElementById('footerInfo').innerHTML =
      'Showing <b>' + from + '–' + to + '</b> of <b>' + total + '</b> members';
  }

  /* ─── Render: Pager ─── */
  function renderPager(totalPages) {
    var html = '';

    html += '<button class="pg" data-go="prev"' +
      (state.page === 1 ? ' disabled' : '') +
      ' aria-label="Previous page">' +
      '<span class="material-icons">chevron_left</span></button>';

    // Show at most 7 page buttons with ellipsis logic
    var pages = [];
    if (totalPages <= 7) {
      for (var p = 1; p <= totalPages; p++) pages.push(p);
    } else {
      pages = [1];
      if (state.page > 3) pages.push('…');
      var lo = Math.max(2, state.page - 1);
      var hi = Math.min(totalPages - 1, state.page + 1);
      for (var i = lo; i <= hi; i++) pages.push(i);
      if (state.page < totalPages - 2) pages.push('…');
      pages.push(totalPages);
    }

    pages.forEach(function (p) {
      if (p === '…') {
        html += '<span style="padding:0 4px;color:var(--secondary-gray-600);font-weight:700;">…</span>';
      } else {
        html += '<button class="pg' + (p === state.page ? ' active' : '') + '"' +
          ' data-go="' + p + '" aria-label="Page ' + p + '"' +
          (p === state.page ? ' aria-current="page"' : '') + '>' + p + '</button>';
      }
    });

    html += '<button class="pg" data-go="next"' +
      (state.page === totalPages ? ' disabled' : '') +
      ' aria-label="Next page">' +
      '<span class="material-icons">chevron_right</span></button>';

    var pager = document.getElementById('pager');
    pager.innerHTML = html;

    pager.querySelectorAll('.pg').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var go = btn.dataset.go;
        if (go === 'prev') state.page = Math.max(1, state.page - 1);
        else if (go === 'next') state.page = Math.min(totalPages, state.page + 1);
        else state.page = +go;
        render();
      });
    });
  }

  /* ─── Main render ─── */
  function render() {
    renderTabs();
    renderSortHeaders();

    var rows  = getFilteredRows();
    var total = rows.length;
    var pages = Math.max(1, Math.ceil(total / state.perPage));

    if (state.page > pages) state.page = pages;

    var start    = (state.page - 1) * state.perPage;
    var pageRows = rows.slice(start, start + state.perPage);

    renderBody(pageRows);
    renderSelectAll(pageRows);
    renderBulkBar();
    renderFooterInfo(total, start);
    renderPager(pages);
  }

  /* ─── Event wiring ─── */

  // Search
  document.getElementById('searchInput').addEventListener('input', function (e) {
    state.search = e.target.value;
    state.page = 1;
    render();
  });

  // Sort headers
  document.querySelectorAll('th.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.dataset.key;
      if (state.sortKey === key) {
        state.sortDir *= -1;
      } else {
        state.sortKey = key;
        state.sortDir = 1;
      }
      render();
    });
  });

  // Reset button
  document.getElementById('resetBtn').addEventListener('click', function () {
    state.search  = '';
    state.filter  = 'All';
    state.sortKey = null;
    state.sortDir = 1;
    state.page    = 1;
    document.getElementById('searchInput').value = '';
    render();
  });

  // Select-all checkbox
  var selectAllChk = document.getElementById('selectAllChk');
  var selectAllHandler = function (e) {
    if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Enter') return;
    if (e.type === 'keydown') e.preventDefault();

    var rows     = getFilteredRows();
    var start    = (state.page - 1) * state.perPage;
    var pageRows = rows.slice(start, start + state.perPage);
    var pageIds  = pageRows.map(function (r) { return r.id; });
    var allSel   = pageIds.every(function (id) { return state.selected.has(id); });

    if (allSel) {
      pageIds.forEach(function (id) { state.selected.delete(id); });
    } else {
      pageIds.forEach(function (id) { state.selected.add(id); });
    }
    render();
  };
  selectAllChk.addEventListener('click', selectAllHandler);
  selectAllChk.addEventListener('keydown', selectAllHandler);

  // Rows per page
  document.getElementById('perPageSelect').addEventListener('change', function (e) {
    state.perPage = +e.target.value;
    state.page    = 1;
    render();
  });

  // Add Member (placeholder)
  document.getElementById('addBtn').addEventListener('click', function () {
    alert('Add Member — connect your backend here!');
  });

  /* ─── Boot ─── */
  render();

})();
</script>
</body>
</html>
